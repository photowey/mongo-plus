# Test profile: ensure mapper scan base-packages for integration tests (manual and generated mappers)
spring:
  data:
    mongodb:
      mongoplus:
        enabled: true
        mapper:
          base-packages: io.github.photowey.mongoplus.examples.spring.boot.b2x.mapper,io.github.photowey.mongoplus.examples.spring.boot.b2x.configmapper,io.github.photowey.mongoplus.examples.spring.boot.b2x.annotated,io.github.photowey.mongoplus.examples.spring.boot.b2x.core.domain.document
